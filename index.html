<style>
:root{--bg:#FAF7F5;--ink:#141214;--soft:#6b6470;--plum:#5B2A4E;--line:#e6dde2;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111F;--ink:#F3EDF1;--soft:#a99fb3;--plum:#C58BB4;--line:#2c2540;--card:#1c1729}}
:root[data-theme="dark"]{--bg:#15111F;--ink:#F3EDF1;--soft:#a99fb3;--plum:#C58BB4;--line:#2c2540;--card:#1c1729}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 1rem/1.7 'Jost',system-ui,sans-serif;transition:background .3s,color .3s;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;line-height:1.1;margin:0}
a{color:inherit}button{font:inherit;color:inherit}
html[lang=ar] body{font-family:'Cairo','Jost',sans-serif}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .logo,html[lang=ar] .last{font-family:'Amiri',serif;font-style:normal;line-height:1.35}
:focus-visible{outline:2px solid var(--plum);outline-offset:3px}
/* loader */
#ld{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#ld.off{opacity:0;visibility:hidden}
#ld b{font:italic 400 4rem 'Cormorant Garamond',serif;color:var(--plum);display:block;text-align:center;animation:pulse 1.4s ease-in-out infinite}
#ld i{display:block;height:2px;width:140px;background:var(--line);margin:14px auto 0;position:relative;overflow:hidden}
#ld i::after{content:"";position:absolute;inset:0;width:40%;background:var(--plum);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes pulse{50%{opacity:.5}}
/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 6vw;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#bar{position:absolute;bottom:-1px;inset-inline-start:0;height:2px;background:var(--plum);width:100%;transform-origin:left;transform:scaleX(0)}
html[dir=rtl] #bar{transform-origin:right}
.logo{font:1.4rem 'Cormorant Garamond',serif;text-decoration:none}
nav .r{display:flex;gap:24px;align-items:center;font-size:.9rem}
nav .r a{text-decoration:none;color:var(--soft);position:relative;padding:2px 0}
nav .r a::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:1px;background:var(--plum);transform:scaleX(0);transition:transform .35s}
nav .r a.act{color:var(--plum)}nav .r a.act::after{transform:scaleX(1)}
.pill{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:.85rem;cursor:pointer}
section{padding:90px 6vw;max-width:1100px;margin:0 auto;position:relative}
h2{font-size:clamp(2rem,4vw,3rem);margin-bottom:28px}
/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:60px;align-items:center;min-height:82vh}
.hero h1{font-size:clamp(2.8rem,7vw,5.6rem);font-style:italic}
.hero p{max-width:34ch;color:var(--soft);font-size:1.1rem;margin:24px 0 32px}
.btn{display:inline-block;border:1px solid var(--plum);color:var(--plum);padding:12px 30px;border-radius:99px;text-decoration:none;background:none;cursor:pointer;transition:.25s}
.btn:hover{background:var(--plum);color:var(--bg)}
.ph{position:relative;justify-self:center;width:min(100%,340px)}
.photo{aspect-ratio:3/4;border-radius:200px 200px 16px 16px;border:1px solid var(--plum);padding:12px;animation:fl 7s ease-in-out infinite}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:190px 190px 6px 6px;display:block}
@keyframes fl{50%{transform:translateY(-12px)}}
.bl{position:absolute;border-radius:50%;filter:blur(50px);opacity:.28;background:var(--plum);pointer-events:none;z-index:-1}
/* reveal */
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s}
.js .rv.in{opacity:1;transform:none}
.story{display:grid;grid-template-columns:1fr 1.6fr;gap:60px;border-top:1px solid var(--line)}
.story p{margin:0 0 18px;font-size:1.05rem;max-width:58ch}
.last{font:italic 1.7rem/1.3 'Cormorant Garamond',serif;color:var(--plum)}
/* 3D */
.stage{position:relative;height:min(66vh,540px);border:1px solid var(--line);border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,var(--card),transparent 72%);touch-action:pan-y}
.stage canvas{width:100%;height:100%;display:block}
.hint{position:absolute;bottom:12px;inset-inline:0;text-align:center;font-size:.8rem;color:var(--soft);pointer-events:none}
.no3d .stage{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px -20px var(--plum)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);margin-bottom:18px;display:block}
.card h3{font-size:1.6rem;margin-bottom:8px}.card p{margin:0 0 14px;color:var(--soft);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tags span,.skills span{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:3px 12px;color:var(--plum)}
.skills{display:flex;flex-wrap:wrap;gap:10px}.skills span{font-size:.92rem;background:var(--card);color:var(--ink);padding:6px 16px}
.row{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--line)}.row h3{font-size:1.4rem}
/* timeline */
.tl{position:relative;padding-inline-start:44px;margin-top:20px}
.tl::before,.tl .fill{content:"";position:absolute;inset-inline-start:11px;top:6px;width:2px;background:var(--line);bottom:30px}
.tl .fill{background:var(--plum);bottom:auto;height:0}
.it{position:relative;padding-bottom:34px}
.dot{position:absolute;inset-inline-start:-40px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:.5s}
.it.on .dot{border-color:var(--plum);background:var(--plum);box-shadow:0 0 0 6px color-mix(in srgb,var(--plum) 20%,transparent)}
.hd{all:unset;cursor:pointer;display:block;width:100%}
.hd small{color:var(--plum);letter-spacing:.08em;text-transform:uppercase;font-size:.75rem}
.hd h3{font-size:1.7rem;margin:2px 0}.hd span{color:var(--soft);font-size:.92rem}
.x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s}.x>div{overflow:hidden;color:var(--soft);max-width:60ch}
.x p{margin:10px 0 0;padding:14px 18px;border-inline-start:2px solid var(--plum);background:var(--card);border-radius:0 10px 10px 0}
html[dir=rtl] .x p{border-radius:10px 0 0 10px}
.it.open .x,.it:hover .x{grid-template-rows:1fr}
.contact{text-align:center;border-top:1px solid var(--line)}.contact h2{font-style:italic}
.links{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:24px}
footer{text-align:center;padding:30px;color:var(--soft);font:italic 1.1rem 'Cormorant Garamond',serif}
/* modal */
dialog{border:1px solid var(--plum);border-radius:18px;background:var(--bg);color:var(--ink);padding:0;width:min(720px,92vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(20,10,25,.6);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .4s}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(20px)}}
dialog img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;display:block}
dialog .b{padding:26px 30px 30px}dialog h3{font-size:2.2rem;margin-bottom:10px}
dialog ul{color:var(--soft);padding-inline-start:20px;margin:0 0 20px}
/* fixed mascot */
#mascot{position:fixed;bottom:0;inset-inline-end:2vw;width:clamp(130px,17vw,270px);height:auto;z-index:30;pointer-events:none;filter:drop-shadow(0 8px 14px rgba(0,0,0,.22))}
/* custom cursor */
#cd,#cr{display:none;position:fixed;left:0;top:0;pointer-events:none;z-index:200}
.cc #cd,.cc #cr{display:block}
.cc,.cc *{cursor:none!important}
.cc dialog[open],.cc dialog[open] *{cursor:auto!important}.cc dialog[open] .btn{cursor:pointer!important}
#cd{width:22px;height:22px;margin:-11px 0 0 -11px;color:var(--plum)}
#cd svg{width:100%;height:100%;display:block;transition:transform .3s}
#cr{width:40px;height:40px;margin:-20px 0 0 -20px;border:1.5px solid var(--plum);border-radius:50%;transition:width .3s,height .3s,margin .3s,background .3s,opacity .3s}
.ch #cr{width:64px;height:64px;margin:-32px 0 0 -32px;background:color-mix(in srgb,var(--plum) 16%,transparent)}
.ch #cd svg{transform:scale(1.5) rotate(45deg)}
.cp #cr{width:28px;height:28px;margin:-14px 0 0 -14px}
.cx #cd,.cx #cr{opacity:0}
.tp{display:block;width:100%;max-width:440px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:12px}
.card .btn+.btn,dialog .btn+.btn{margin-inline-start:8px}
.hd:focus-visible{outline:2px solid var(--plum);outline-offset:6px}
@media(max-width:760px){.hero,.story,.row{grid-template-columns:1fr;gap:30px}.hero{min-height:auto}nav .r a{display:none}section{padding:64px 6vw}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style></head>

s1:'I used to reorganize my bookshelf by color, then by mood, then by color again. I have always liked turning something messy into something calm.',
s2:'Then one day a broken button on a website annoyed me so much that I opened the inspector and changed it. The page obeyed. Something I imagined was suddenly real, and someone else could use it.',
s3:'That was the moment. Software is the one craft where an idea becomes a room people can walk into. I chose software engineering to build rooms that are quiet, precise, and kind to whoever steps inside.',s4:'Details matter.',

const TI=['uni','depi'];
let L=(()=>{try{return localStorage.getItem('lang')}catch(e){return null}})()||'en';
/* images */
$$('[data-img]').forEach(e=>e.src=IMGS[e.dataset.img]);
/* render */
function render(){const d=D[L];root.lang=L;root.dir=L=='ar'?'rtl':'ltr';
 $$('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);
 $('#lang').textContent=d.ar;$('#theme').textContent=dark()?d.light:d.dark;
 $('#cards').innerHTML=P.map((p,i)=>`<article class="card rv in"><img loading="lazy" src="${IMGS[p.k]}" alt="${d.proj[i][0]}"><h3>${d.proj[i][0]}</h3><p>${d.proj[i][1]}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div><button class="btn" data-c="${i}">${d.more}</button>${p.gh?`<a class="btn" href="${p.gh}" target="_blank" rel="noopener">GitHub</a>`:''}</article>`).join('');
 $$('[data-c]').forEach(b=>b.onclick=()=>openCase(+b.dataset.c));
 $('#tl').innerHTML='<span class="fill" id="fill"></span>'+d.tls.map((t,i)=>`<div class="it rv in"><span class="dot"></span><button class="hd" aria-expanded="false"><small>${t[0]}</small><h3>${t[1]}</h3><span>${t[2]}</span></button>${TI[i]?`<img class="tp" loading="lazy" src="${IMGS[TI[i]]}" alt="${t[2]}">`:''}<div class="x"><div><p>${t[3]}</p></div></div></div>`).join('');
 $$('.hd').forEach(b=>b.onclick=()=>{const it=b.parentElement,o=it.classList.toggle('open');b.setAttribute('aria-expanded',o)});
 if(window.relabel)relabel();}
function dark(){const t=root.getAttribute('data-theme');return t?t=='dark':matchMedia('(prefers-color-scheme:dark)').matches}
$('#lang').onclick=()=>{L=L=='en'?'ar':'en';try{localStorage.setItem('lang',L)}catch(e){}render()};
$('#theme').onclick=()=>{const t=dark()?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('theme',t)}catch(e){}$('#theme').textContent=dark()?D[L].light:D[L].dark;if(window.recolor)recolor()};
/* case study modal */
const cm=$('#cm');
function openCase(i){const d=D[L],p=d.proj[i];cm.innerHTML=`<img src="${IMGS[P[i].k]}" alt="${p[0]}"><div class="b"><h3 id="cmt">${p[0]}</h3><p>${p[1]}</p><ul>${p[2].map(x=>`<li>${x}</li>`).join('')}</ul><div class="tags">${P[i].tags.map(t=>`<span>${t}</span>`).join('')}</div>${P[i].gh?`<a class="btn" href="${P[i].gh}" target="_blank" rel="noopener">GitHub</a> `:''}<button class="btn" onclick="cm.close()">${d.close}</button></div>`;cm.showModal()}
cm.addEventListener('click',e=>{if(e.target===cm)cm.close()});
/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
$$('.rv:not(.in)').forEach(e=>io.observe(e));
/* active section */
const secs=$$('section[id]'),links=$$('nav .r a');
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('act',a.getAttribute('href')=='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
secs.forEach(s=>so.observe(s));
/* custom cursor */
if(matchMedia('(pointer:fine)').matches&&!reduce){root.classList.add('cc');
 var cx=-100,cy=-100,rx=-100,ry=-100;const cd=$('#cd'),cr=$('#cr');
 addEventListener('pointermove',e=>{cx=e.clientX;cy=e.clientY;const el=e.target.closest&&e.target.closest('a,button,.hd');document.body.classList.toggle('ch',!!(el||window.h3));document.body.classList.remove('cx')},{passive:true});
 document.addEventListener('pointerleave',()=>document.body.classList.add('cx'));
 addEventListener('pointerdown',()=>document.body.classList.add('cp'));addEventListener('pointerup',()=>document.body.classList.remove('cp'))}
/* main loop: progress bar, parallax, timeline, avatar */
const pe=$$('[data-p]');
function tick(){const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
 $('#bar').style.transform=`scaleX(${h>0?y/h:0})`;
 if(!reduce)pe.forEach(e=>e.style.transform=`translate3d(0,${y*+e.dataset.p}px,0)`);
 const tl=$('#tl'),f=$('#fill');
 if(tl&&f){const r=tl.getBoundingClientRect();f.style.height=clamp((innerHeight*.6-r.top)/r.height,0,1)*(r.height-30)+'px';
  $$('.it').forEach(it=>it.classList.toggle('on',it.getBoundingClientRect().top<innerHeight*.6))}
 if(root.classList.contains('cc')){rx+=(cx-rx)*.16;ry+=(cy-ry)*.16;
  $('#cd').style.transform=`translate3d(${cx}px,${cy}px,0) rotate(${clamp((cx-rx)*.6,-40,40)}deg)`;
  $('#cr').style.transform=`translate3d(${rx}px,${ry}px,0)`}
 requestAnimationFrame(tick)}
/* 3D showcase */
(function(){
 if(reduce||!window.THREE){root.classList.add('no3d');return}
 const cv=$('#gl'),box=$('#stage');let R;
 try{R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true})}catch(e){root.classList.add('no3d');return}
 R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
 const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.1,100),G=new THREE.Group();S.add(G);
 const col=()=>getComputedStyle(root).getPropertyValue('--plum').trim();
 const cards=[],labs=[],borders=[];
 function paint(l){const x=l.c.getContext('2d');x.clearRect(0,0,512,80);x.font='italic 44px Georgia,serif';x.fillStyle=col();x.textAlign='center';x.fillText(D[L].proj[l.i][0],256,54);l.t.needsUpdate=true}
 P.forEach((p,i)=>{const g=new THREE.Group(),tx=new THREE.TextureLoader().load(IMGS[p.k]);tx.encoding=THREE.sRGBEncoding;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2),new THREE.MeshBasicMaterial({map:tx}));
  const b=new THREE.Mesh(new THREE.PlaneGeometry(3.3,2.1),new THREE.MeshBasicMaterial({color:col()}));b.position.z=-.02;borders.push(b);
  const c=document.createElement('canvas');c.width=512;c.height=80;const t=new THREE.CanvasTexture(c),l={c,t,i};labs.push(l);paint(l);
  const lb=new THREE.Mesh(new THREE.PlaneGeometry(3.2,.5),new THREE.MeshBasicMaterial({map:t,transparent:true}));lb.position.y=-1.4;
  g.add(b,m,lb);g.position.set((i-1)*3.9,0,-Math.abs(i-1)*1.3);g.rotation.y=(1-i)*.3;G.add(g);cards.push({g,m,i})});
 const n=140,pos=new Float32Array(n*3);for(let i=0;i<n*3;i++)pos[i]=(Math.random()-.5)*(i%3==2?8:18);
 const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
 const pm=new THREE.PointsMaterial({size:.05,color:col(),transparent:true,opacity:.6}),pts=new THREE.Points(pg,pm);S.add(pts);
 window.recolor=()=>{borders.forEach(b=>b.material.color.set(col()));pm.color.set(col());labs.forEach(paint)};
 window.relabel=()=>labs.forEach(paint);
 const mouse=new THREE.Vector2(),ray=new THREE.Raycaster();let hov=-1,vis=false,run=false,t=0,baseZ=9;
 function pick(e){const r=box.getBoundingClientRect();mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,C);const h=ray.intersectObjects(cards.map(c=>c.m));hov=h.length?cards.findIndex(c=>c.m===h[0].object):-1;window.h3=hov>-1;document.body.classList.toggle('ch',hov>-1)}
 box.addEventListener('pointermove',pick);
 box.addEventListener('pointerleave',()=>{mouse.set(0,0);hov=-1;window.h3=false;document.body.classList.remove('ch')});
 box.addEventListener('click',e=>{pick(e);if(hov>-1)openCase(hov)});
 function size(){const w=box.clientWidth,h=box.clientHeight;R.setSize(w,h,false);C.aspect=w/h;baseZ=w<640?15:9;C.updateProjectionMatrix()}
 new ResizeObserver(size).observe(box);size();C.position.z=baseZ;
 function frame(){if(!vis){run=false;return}requestAnimationFrame(frame);t+=.012;
  C.position.x+=(mouse.x*1.6-C.position.x)*.05;C.position.y+=(mouse.y*.8-C.position.y)*.05;C.position.z+=(baseZ-C.position.z)*.05;C.lookAt(0,0,0);
  const r=box.getBoundingClientRect(),p=(innerHeight-r.top)/(innerHeight+r.height);G.rotation.y=(p-.5)*.7;pts.rotation.y=t*.05;
  cards.forEach(c=>{c.g.position.y=Math.sin(t+c.i*2)*.16;const s=c.i==hov?1.14:1;c.g.scale.x+=(s-c.g.scale.x)*.12;c.g.scale.y=c.g.scale.z=c.g.scale.x});
  R.render(S,C)}
 new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis&&!run){run=true;frame()}}).observe(box);
})();
/* in-page links: scroll manually (works inside previews/iframes too) */
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;const el=document.getElementById(a.getAttribute('href').slice(1));if(!el)return;e.preventDefault();el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})});
render();requestAnimationFrame(tick);
function hide(){setTimeout(()=>$('#ld').classList.add('off'),650)}
addEventListener('load',hide);setTimeout(hide,3500);
</script></body></html>
